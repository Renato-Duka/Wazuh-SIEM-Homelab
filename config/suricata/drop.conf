# /etc/suricata/drop.conf
#
# Read by suricata-update: every rule in these Emerging Threats Open groups is
# rewritten from "alert" to "drop", so Suricata blocks matching traffic instead
# of only logging it. Limited to high-confidence malware and exploit categories
# to keep false positives low; widen it only after watching alerts for a while.
group:emerging-malware.rules
group:emerging-exploit.rules
group:emerging-mobile_malware.rules
