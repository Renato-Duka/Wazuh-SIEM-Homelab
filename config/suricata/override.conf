# /etc/systemd/system/suricata.service.d/override.conf
#
# Systemd drop-in that switches Suricata from passive af-packet capture (IDS)
# to inline NFQUEUE mode (IPS), reading packets from netfilter queue 0.
# The empty ExecStart= line clears the packaged command before replacing it.
[Service]
ExecStart=
ExecStart=/usr/bin/suricata -D -q 0 -c /etc/suricata/suricata.yaml --pidfile /var/run/suricata/suricata.pid
